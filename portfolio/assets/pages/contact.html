<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/portfolio/assets/css/style.css" />
    <!-- Custom Responsive Media Query -->
    <link rel="stylesheet" href="/portfolio/assets/css/responsiveQueries.css" />
    <!-- Custom Header CSS -->
    <link rel="stylesheet" href="/portfolio/assets/css/header/header.css" />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="/portfolio/assets/bootstrap/css/bootstrap.min.css"
    />
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <!-- Google font Awesome icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
    <!-- Animated -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body>
    <div class="container-fluid bg-black">
      <div class="container btn-centers">
        <div class="row justify-content-center">
          <div class="col-12 col-md-6 col-lg-4 text-white">
            <div class="shadow-lg bg-white rounded">
              <h2 class="text-center text-black py-4 fw-bold">Sign In</h2>
              <form action="">
                <!-- Username -->
                <div class="mb-3 px-3">
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    placeholder="Username"
                  />
                </div>

                <!-- Email -->
                <div class="mb-3 px-3">
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    placeholder="Email"
                  />
                </div>

                <!-- Password -->
                <div class="mb-3 px-3">
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="password"
                  />
                </div>

                <!-- Remember Me -->
                <div class="form-check mb-3 mx-3">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="remember"
                  />
                  <label class="form-check-label text-black" for="remember">
                    Remember me
                  </label>
                  <a href="" class="float-end text-decoration-none"
                    >Forget Password</a
                  >
                </div>

                <!-- Submit Button -->
                <div class="px-3">
                  <button type="submit" class="btn btn-success mb-3 w-100">
                    Sign In
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
