<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conatct Us</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/portfolio/assets/css/style.css" />
    <!-- Custom Responsive Media Query -->
    <link rel="stylesheet" href="/portfolio/assets/css/responsiveQueries.css" />
    <!-- Custom Header CSS -->
    <link rel="stylesheet" href="/portfolio/assets/css/header/header.css" />
    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="/portfolio/assets/bootstrap/css/bootstrap.min.css"
    />
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <!-- Google font Awesome icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
    <!-- Animated -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body>
    <div class="container-fluid">
      <div class="container mt-5">
        <div class="row justify-content-center align-items-center">
          <div class="col-12 col-md-6 col-lg-5">
            <h2 class="fw-bolder">Please Contact Us</h2>
            <hr class="w-50 border border-1 border-success opacity-100" />
            <p class="text-muted">
              Lorem ipsum dolor, sit amet consectetur adipisicing elit. Adipisci
              earum illum culpa pariatur dignissimos rerum aliquid consequuntur
              sit. Molestiae, ad?
            </p>

            <!-- Phone -->
            <div class="d-flex align-items-center mb-3">
              <h5 class="fw-bold mb-0 me-3">Phone :</h5>
              <span class="px-5 fw-bolder">91+7817012894</span>
            </div>
            <hr />
            <!-- Email -->
            <div class="d-flex align-items-center mb-3">
              <h5 class="fw-bold mb-0 me-3">Email :</h5>
              <span class="px-5 fw-bolder">info@example.com</span>
            </div>
            <hr />
            <!-- Email -->
            <div class="d-flex align-items-center mb-3">
              <h5 class="fw-bold mb-0 me-3">Address :</h5>
              <span class="px-4 fw-bolder">Noida India</span>
            </div>
            <hr />
            <!-- Follow Us -->
            <div class="d-flex align-items-center mb-3">
              <h5 class="fw-bold mb-0 me-5">Follow Us :</h5>
              <i class="fa-brands fa-instagram px-4 text-danger fs-4"></i>
              <i class="fa-brands fa-facebook px-4 text-primary fs-4"></i>
              <i class="fa-brands fa-square-twitter px-4 text-black fs-4"></i>
              <i
                class="fa-brands fa-linkedin-in px-4 linkedin fs-4"
                style="color: #0a66c2"
              ></i>
            </div>
          </div>
          <!-- contact us form -->
          <div class="col-12 col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg">
              <div class="card-body p-5">
                <h2 class="text-center fw-bold">Contact Us</h2>

                <hr class="border-success border-2 opacity-100" />

                <form>
                  <!-- firstname -->
                  <div class="mb-3">
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Firstname"
                      required
                    />
                  </div>
                  <!-- lastname -->
                  <div class="mb-3">
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Lastname"
                      required
                    />
                  </div>
                  <!-- email -->
                  <div class="mb-3">
                    <input
                      type="email"
                      class="form-control"
                      placeholder="Email"
                      required
                    />
                  </div>
                  <!-- phone -->
                  <div class="mb-3">
                    <input
                      type="email"
                      class="form-control"
                      placeholder="Phone"
                      required
                    />
                  </div>
                  <!-- message -->
                  <div class="mb-4">
                    <textarea
                      class="form-control"
                      rows="5"
                      placeholder="Enter your message"
                    ></textarea>
                  </div>
                  <!-- send message button -->
                  <button class="btn btn-success w-100 fw-bold py-2">
                    Send Message
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Custom JavaScript -->
    <link rel="stylesheet" href="/portfolio/assets/js/first.js" />
    <!-- Bootstrap JS -->
    <script src="/portfolio/assets/bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
